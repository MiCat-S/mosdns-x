log:
  level: info

control:
  public_dns_url: https://dns.example.com/dns-query
  panel_origin: https://panel.example.com
  # 可选：将可安全热更新的上游、缓存与统计保留策略交给管理员面板管理。
  # managed_config: /var/lib/mosdns/managed.yaml
  development: false
  query_log: true
  enable_pprof: false
  trusted_proxies:
    - 127.0.0.1/32

  storage:
    driver: mysql
    mysql:
      dsn: "mosdns:CHANGE_ME@tcp(127.0.0.1:3306)/mosdns?charset=utf8mb4&timeout=5s&readTimeout=5s&writeTimeout=5s"
      max_open_conns: 32
      max_idle_conns: 8
      conn_max_lifetime_sec: 1800
      operation_timeout_ms: 1500

  # 统计后端默认跟随控制后端，并复用 storage.mysql.dsn。
  # 省略或设为 0 时使用 50000 的默认扫描预算。
  health_scan_limit: 50000
  # 受理路径调优。每次受理仍在放行前落盘提交，这些参数只改变
  # 多少次受理共用一次提交、以及槽位占满时排队多久；不会跳过落盘、
  # 异步补扣或超额放行。省略或设为 0 时使用下列默认值。仅 bbolt 生效。
  admit:
    queue_size: 1024
    wait_ms: 250
    batch_delay_ms: 1
    batch_size: 128
  telemetry:
    driver: mysql
    queue_size: 8192
    batch_size: 256
    flush_interval_ms: 1000
    # 分钟聚合 1～31 天；查询明细 1～720 小时；记录数 1000～5000000。
    aggregate_retention_days: 7
    query_retention_hours: 24
    max_query_records: 100000

api:
  http: 127.0.0.1:18081

plugins:
  - tag: cache
    type: cache
    args:
      size: 10240

  - tag: upstream
    type: fast_forward
    args:
      upstream:
        - addr: udp://1.1.1.1:53
        - addr: udp://9.9.9.9:53

  - tag: main
    type: sequence
    args:
      exec:
        - cache
        - upstream

servers:
  - exec: main
    listeners:
      - protocol: http
        addr: 127.0.0.1:18443
        url_path: /dns-query
