log:
  level: info

control:
  database: /var/lib/mosdns/control.db
  stats_database: /var/lib/mosdns/stats.db
  public_dns_url: https://dns.example.com/dns-query
  panel_origin: https://panel.example.com
  development: false
  query_log: false
  enable_pprof: false
  trusted_proxies:
    - 127.0.0.1/32
  # 省略或设为 0 时使用 50000 的默认扫描预算。
  health_scan_limit: 50000
  # 受理路径调优。每次受理仍在放行前落盘提交，这些参数只改变
  # 多少次受理共用一次提交、以及槽位占满时排队多久；不会跳过落盘、
  # 异步补扣或超额放行。省略或设为 0 时使用下列默认值。仅 bbolt 生效。
  admit:
    queue_size: 1024
    wait_ms: 250
    batch_delay_ms: 1
    batch_size: 128
  telemetry:
    # 省略或设为 0 时分别使用 7 天、24 小时和 100000 条默认值。
    aggregate_retention_days: 7
    query_retention_hours: 24
    max_query_records: 100000

api:
  http: 127.0.0.1:18081

plugins:
  - tag: local_answer
    type: blackhole
    args:
      rcode: 0

servers:
  - exec: local_answer
    listeners:
      - protocol: doh
        addr: 0.0.0.0:443
        url_path: /dns-query
        cert: /etc/mosdns/tls.crt
        key: /etc/mosdns/tls.key
      - protocol: doh3
        addr: 0.0.0.0:443
        url_path: /dns-query
        cert: /etc/mosdns/tls.crt
        key: /etc/mosdns/tls.key
