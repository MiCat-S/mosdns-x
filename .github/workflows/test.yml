name: Test mosdns

on:
  # Only main, so a commit is not tested twice. An unfiltered push ran once for
  # the topic branch and again for the same SHA when main fast-forwarded onto
  # it, and ran a third time alongside pull_request for any branch with a PR
  # open. A topic branch is covered by pull_request, and by main once merged.
  # It also keeps tag pushes out; releases are verified by release.yml.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # Pin the toolchain to go.mod, the same as the MySQL job and the release
      # build, instead of whatever a mutable upstream manifest says is newest.
      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test frontend
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm test
          npm run build

      # go.sum is committed, so go build/test/vet already run with
      # -mod=readonly by default and fail on a go.mod that needs updating.
      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./...

      # The control panel adds a telemetry queue, generation hot-swap, admit
      # slots and a health probe, all of which are concurrent. Run the detector
      # so a new race fails here instead of in production.
      - name: Test Go with the race detector
        run: go test -race ./...

      - name: Build headless
        run: go build

      - name: Test embedded frontend
        run: go test -tags ui ./web

      - name: Build with embedded frontend
        run: go build -tags ui

      - name: Test release script
        run: python3 release_test.py

      # Needs neither root nor network: systemctl and curl are replaced by
      # fakes and the drop-in is written under a temporary SYSTEMD_DROPIN_DIR.
      - name: Test installer helpers
        run: bash install_test.sh

      - name: Test monitoring report
        run: python3 -m unittest discover -s security-review -p 'monitoring_report_test.py'

  mysql:
    name: MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: mosdns_test
          MYSQL_USER: mosdns
          MYSQL_PASSWORD: mosdns-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test MySQL backends
        env:
          MOSDNS_TEST_MYSQL_DSN: "mosdns:mosdns-test-password@tcp(127.0.0.1:3306)/mosdns_test?charset=utf8mb4&timeout=5s&readTimeout=5s&writeTimeout=5s"
        run: go test -race ./internal/control ./internal/telemetry
