name: Test mosdns

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: get latest go version
        id: go
        run: |
          echo version=$(curl -s https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | grep -oE '"version": "[0-9]{1}.[0-9]{1,}(.[0-9]{1,})?"' | head -1 | cut -d':' -f2 | sed 's/ //g; s/"//g') >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{steps.go.outputs.version}}
          cache: false

      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Test Go
        run: go test ./...

      - name: Build headless
        run: go build

      - name: Test embedded frontend
        run: go test -tags ui ./web

      - name: Build with embedded frontend
        run: go build -tags ui

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mosdns_test
          MYSQL_USER: mosdns
          MYSQL_PASSWORD: mosdns-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test MySQL backends
        env:
          MOSDNS_TEST_MYSQL_DSN: "mosdns:mosdns-test-password@tcp(127.0.0.1:3306)/mosdns_test?charset=utf8mb4&timeout=5s&readTimeout=5s&writeTimeout=5s"
        run: go test ./internal/control ./internal/telemetry
