name: Verify release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify uploaded archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            mosdns-darwin-amd64.zip
            mosdns-darwin-arm64.zip
            mosdns-linux-amd64.zip
            mosdns-linux-amd64-v3.zip
            mosdns-linux-arm-5.zip
            mosdns-linux-arm-6.zip
            mosdns-linux-arm-7.zip
            mosdns-linux-arm64.zip
            mosdns-linux-mipsle-softfloat.zip
            mosdns-linux-mips64le-hardfloat.zip
            mosdns-linux-ppc64le.zip
            mosdns-freebsd-amd64.zip
            mosdns-windows-amd64.zip
          )

          release_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          asset_names="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --paginate --jq '.[].name')"

          artifact_dir="${RUNNER_TEMP}/release-assets"
          mkdir -p "$artifact_dir"

          # The release must carry exactly the 13 archives and SHA256SUMS:
          # a missing asset and an extra one (a stale zip, a partial build's
          # SHA256SUMS.partial, a stray config.yaml) both fail here.
          printf '%s\n' "${expected[@]}" SHA256SUMS \
            | LC_ALL=C sort >"$artifact_dir/expected-assets"
          printf '%s\n' "$asset_names" | sed '/^$/d' \
            | LC_ALL=C sort >"$artifact_dir/actual-assets"
          if ! diff -u "$artifact_dir/expected-assets" "$artifact_dir/actual-assets"; then
            missing="$(LC_ALL=C comm -23 "$artifact_dir/expected-assets" "$artifact_dir/actual-assets")"
            extra="$(LC_ALL=C comm -13 "$artifact_dir/expected-assets" "$artifact_dir/actual-assets")"
            if [ -n "$missing" ]; then
              printf 'Missing release asset: %s\n' $missing >&2
            fi
            if [ -n "$extra" ]; then
              printf 'Unexpected release asset: %s\n' $extra >&2
            fi
            echo "Release assets must be exactly the 13 archives and SHA256SUMS" >&2
            exit 1
          fi

          for asset in "${expected[@]}" SHA256SUMS; do
            gh release download "$RELEASE_TAG" \
              --dir "$artifact_dir" --pattern "$asset"
          done

          awk '{ name=$2; sub(/^\*/, "", name); print name }' \
            "$artifact_dir/SHA256SUMS" | LC_ALL=C sort >"$artifact_dir/checksum-files"
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort >"$artifact_dir/expected-files"
          if ! diff -u "$artifact_dir/expected-files" "$artifact_dir/checksum-files"; then
            echo "SHA256SUMS must list exactly the 13 release archives" >&2
            exit 1
          fi

          cd "$artifact_dir"
          sha256sum -c SHA256SUMS

          release_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          for asset in "${expected[@]}"; do
            test "$(unzip -p "$asset" BUILD-INFO.txt | sed -n 's/^version=//p')" = "$RELEASE_TAG"
            test "$(unzip -p "$asset" BUILD-INFO.txt | sed -n 's/^commit=//p')" = "$release_commit"
          done
